name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_DB: rapportai_test
          POSTGRES_USER: rapportai
          POSTGRES_PASSWORD: rapportai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rapportai -d rapportai_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:8.2.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://rapportai:rapportai@localhost:5432/rapportai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m alembic upgrade head
      - run: python -m scripts.ingest_knowledge --fake
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
